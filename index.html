<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Location System</title>
</head>

<body>
  <h2>📍 AI定位系统运行中...</h2>
  <p id="status">初始化中...</p>

<script>
const SUPABASE_URL = "https://yzhposuiczzthtctafuk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6aHBvc3VpY3p6dGh0Y3RhZnVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MzU3MzMsImV4cCI6MjA5ODAxMTczM30.OWZpBrCxPs-mWCOO0AemjDARelZjI1z6Nv_BsZayzD8";

function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

function safeText(v) {
  return v === undefined || v === null ? "" : v;
}

// 🚀 1. 获取最新位置（防卡死）
async function getLatest() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/user_location?select=lat,lng&order=id.desc&limit=1`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    const data = await res.json();

    if (!Array.isArray(data) || data.length === 0) {
      return null;
    }

    return data[0];
  } catch (e) {
    console.log("SUPABASE ERROR:", e);
    return null;
  }
}

// 🌍 2. 城市解析（彻底兜底版）
async function getCity(lat, lng) {
  try {
    const res = await fetch(
      `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`
    );

    const data = await res.json();
    const addr = data?.address || {};

    const city =
      addr.city ||
      addr.town ||
      addr.village ||
      addr.county ||
      addr.state ||
      addr.country;

    if (!city) return `${lat.toFixed(2)}, ${lng.toFixed(2)}`;

    return city;

  } catch (e) {
    return `${lat.toFixed(2)}, ${lng.toFixed(2)}`;
  }
}

// 🌡 3. 天气（防失败）
async function getWeather(lat, lng) {
  try {
    const res = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`
    );

    const data = await res.json();
    return data?.current_weather?.temperature ?? "未知";
  } catch (e) {
    return "未知";
  }
}

// 🚀 4. 主流程（不会卡死版）
async function update() {
  try {
    setStatus("读取位置...");

    const loc = await getLatest();

    if (!loc) {
      setStatus("暂无定位数据（请先打开手机页面）");
      return;
    }

    const lat = loc.lat;
    const lng = loc.lng;

    setStatus("解析城市...");

    let city = await getCity(lat, lng);

    setStatus("获取天气...");

    let temp = await getWeather(lat, lng);

    setStatus(`📍 ${safeText(city)} | 🌡 ${safeText(temp)}°C`);

  } catch (e) {
    console.log(e);
    setStatus("系统错误（请刷新）");
  }
}

// 🚀 启动（关键：防止“初始化中卡死”）
setTimeout(update, 500);
setInterval(update, 15000);

</script>

</body>
</html>
