<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Companion v3</title>
</head>

<body>
  <h2>🤖 AI伴侣 v3 正在理解你的生活...</h2>
  <p id="status">初始化中...</p>

<script>
const SUPABASE_URL = "https://yzhposuiczzthtctafuk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6aHBvc3VpY3p6dGh0Y3RhZnVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MzU3MzMsImV4cCI6MjA5ODAxMTczM30.OWZpBrCxPs-mWCOO0AemjDARelZjI1z6Nv_BsZayzD8";

function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

// 获取数据
async function getData() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/user_location?select=lat,lng,created_at&order=id.desc&limit=60`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    return await res.json() || [];
  } catch {
    return [];
  }
}

// 天气
async function getWeather(lat, lng) {
  try {
    const res = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`
    );

    const data = await res.json();
    return data?.current_weather?.temperature ?? "未知";
  } catch {
    return "未知";
  }
}

// 🏠 找“家”
function findHome(list) {
  const map = new Map();

  for (const item of list) {
    const key = `${Math.round(item.lat * 10)},${Math.round(item.lng * 10)}`;
    map.set(key, (map.get(key) || 0) + 1);
  }

  let home = null;
  let max = 0;

  for (const [k, v] of map.entries()) {
    if (v > max) {
      max = v;
      home = k;
    }
  }

  return home;
}

// 🧠 情绪分析（v3核心）
function analyzeEmotion(list, current) {
  const home = findHome(list);
  const currentKey = `${Math.round(current.lat * 10)},${Math.round(current.lng * 10)}`;

  let emotion = "";

  // 🏠 在家
  if (home === currentKey) {
    emotion = "home";
  } else {
    const prev = list[1];

    if (!prev) return "normal";

    const moved =
      Math.abs(current.lat - prev.lat) > 0.02 ||
      Math.abs(current.lng - prev.lng) > 0.02;

    emotion = moved ? "active" : "stable";
  }

  return emotion;
}

// 🤖 主逻辑（v3核心）
async function update() {
  try {
    setStatus("我在感受你的状态...");

    const list = await getData();

    if (!list || list.length === 0) {
      setStatus("我还没有足够的信息了解你...");
      return;
    }

    const current = list[0];

    const lat = current.lat;
    const lng = current.lng;

    const temp = await getWeather(lat, lng);

    let area = "你的当前位置";

    if (lat > 35 && lng > 100 && lng < 125) {
      area = "中国东部地区";
    } else if (lat > 20 && lat <= 35 && lng > 105) {
      area = "中国南方地区";
    } else if (lat > 35 && lng < 105) {
      area = "中国西北地区";
    }

    const emotion = analyzeEmotion(list, current);

    let moodText = "";
    let careText = "";

    // 🌡 天气情绪
    if (temp >= 30) moodText = "有点热";
    else if (temp >= 20) moodText = "挺舒服";
    else if (temp >= 10) moodText = "有点凉";
    else moodText = "很冷";

    // ❤️ AI“关心表达”（v3重点）
    if (emotion === "home") {
      careText = "你现在在常驻的位置，好好休息一下也不错。";
    } 
    else if (emotion === "active") {
      careText = "你今天移动得比较多，是在忙事情吗？注意别太累了。";
    } 
    else if (emotion === "stable") {
      careText = "你今天状态比较稳定，我在慢慢了解你的节奏。";
    } 
    else {
      careText = "我还在观察你的生活规律。";
    }

    const finalText =
      `你现在在${area}，天气${moodText}，温度约${temp}°C。\n\n${careText}`;

    setStatus(`📍 ${area}\n🌡 ${temp}°C\n🧠 ${finalText}`);

  } catch (e) {
    console.log(e);
    setStatus("我刚刚有点走神了，可以再试一次吗？");
  }
}

// 启动
setTimeout(update, 500);
setInterval(update, 15000);

</script>

</body>
</html>
