<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Location System</title>
</head>

<body>
  <h2>📍 AI定位系统运行中...</h2>
  <p id="status">初始化中...</p>

<script>
const SUPABASE_URL = "https://yzhposuiczzthtctafuk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6aHBvc3VpY3p6dGh0Y3RhZnVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MzU3MzMsImV4cCI6MjA5ODAxMTczM30.OWZpBrCxPs-mWCOO0AemjDARelZjI1z6Nv_BsZayzD8";

function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

// 获取最新位置
async function getLatest() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/user_location?select=lat,lng&order=id.desc&limit=1`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    const data = await res.json();
    return data?.[0] || null;

  } catch (e) {
    return null;
  }
}

// 获取天气
async function getWeather(lat, lng) {
  try {
    const res = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`
    );

    const data = await res.json();
    return data?.current_weather?.temperature ?? "未知";

  } catch (e) {
    return "未知";
  }
}

// 🤖 AI说话核心
async function update() {
  try {
    setStatus("读取位置...");

    const loc = await getLatest();

    if (!loc) {
      setStatus("暂无定位数据（请先打开手机页面）");
      return;
    }

    const lat = loc.lat;
    const lng = loc.lng;

    setStatus("获取天气...");

    const temp = await getWeather(lat, lng);

    setStatus("AI分析中...");

    // 🌍 简单区域判断（稳定，不依赖城市API）
    let area = "";

    if (lat > 35 && lng > 100 && lng < 125) {
      area = "中国东部地区";
    } else if (lat > 20 && lat <= 35 && lng > 105) {
      area = "中国南方地区";
    } else if (lat > 35 && lng < 105) {
      area = "中国西北地区";
    } else {
      area = "当前位置（根据坐标）";
    }

    // 🧠 AI天气建议
    let advice = "";

    if (temp >= 30) {
      advice = "天气很热，注意防晒和补水";
    } else if (temp >= 20) {
      advice = "天气舒适，适合外出";
    } else if (temp >= 10) {
      advice = "有点凉，建议带外套";
    } else {
      advice = "天气较冷，注意保暖";
    }

    setStatus(`📍 ${area}\n🌡 ${temp}°C\n🧠 ${advice}`);

  } catch (e) {
    console.log(e);
    setStatus("系统错误，请刷新");
  }
}

// 启动
setTimeout(update, 500);
setInterval(update, 15000);

</script>

</body>
</html>
