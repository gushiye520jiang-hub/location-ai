<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Companion v3</title>
</head>

<body>
  <h2>🤖 AI伴侣 v3 正在理解你的生活...</h2>
  <pre id="status">初始化中...</pre>

<script>

const SUPABASE_URL = "https://yzhposuiczzthtctafuk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6aHBvc3VpY3p6dGh0Y3RhZnVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MzU3MzMsImV4cCI6MjA5ODAxMTczM30.OWZpBrCxPs-mWCOO0AemjDARelZjI1z6Nv_BsZayzD8";

/* =========================
   UI
========================= */
function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

/* =========================
   读取历史数据
========================= */
async function getData() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/user_location?select=lat,lng,created_at&order=created_at.desc&limit=60`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    return await res.json() || [];
  } catch (e) {
    console.log("getData error", e);
    return [];
  }
}

/* =========================
   天气
========================= */
async function getWeather(lat, lng) {
  try {
    const res = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`
    );

    const data = await res.json();
    return data?.current_weather?.temperature ?? "未知";
  } catch {
    return "未知";
  }
}

/* =========================
   AI：找常驻点
========================= */
function findHome(list) {
  const map = new Map();

  for (const item of list) {
    const key = `${Math.round(item.lat * 10)},${Math.round(item.lng * 10)}`;
    map.set(key, (map.get(key) || 0) + 1);
  }

  let home = null;
  let max = 0;

  for (const [k, v] of map.entries()) {
    if (v > max) {
      max = v;
      home = k;
    }
  }

  return home;
}

/* =========================
   AI：行为分析
========================= */
function analyzeLife(list, current) {
  const home = findHome(list);
  const currentKey = `${Math.round(current.lat * 10)},${Math.round(current.lng * 10)}`;

  if (home === currentKey) {
    return "🏠 你现在在常驻位置（像是在家）";
  }

  if (list.length < 3) {
    return "📍 我正在学习你的生活规律...";
  }

  const prev = list[1];

  const moved =
    Math.abs(current.lat - prev.lat) > 0.02 ||
    Math.abs(current.lng - prev.lng) > 0.02;

  if (moved) {
    return "🚶 你最近在频繁移动";
  }

  return "🧭 你的活动节奏比较稳定";
}

/* =========================
   主AI逻辑
========================= */
async function update() {
  try {
    setStatus("🧠 AI分析中...");

    const list = await getData();

    if (!list.length) {
      setStatus("📡 还没有收到你的定位数据");
      return;
    }

    const current = list[0];

    const lat = current.lat;
    const lng = current.lng;

    const temp = await getWeather(lat, lng);

    let area = "你的当前位置";

    if (lat > 35 && lng > 100 && lng < 125) {
      area = "中国东部";
    } else if (lat > 20 && lat <= 35 && lng > 105) {
      area = "中国南方";
    } else if (lat > 35 && lng < 105) {
      area = "中国西北";
    }

    let mood = "";
    if (temp >= 30) mood = "很热";
    else if (temp >= 20) mood = "舒适";
    else if (temp >= 10) mood = "有点凉";
    else mood = "很冷";

    const life = analyzeLife(list, current);

    setStatus(
`📍 区域：${area}
🌡 温度：${temp}°C（${mood}）

🧠 AI判断：
${life}
`
    );

  } catch (e) {
    console.log(e);
    setStatus("⚠️ AI运行异常，刷新重试");
  }
}

/* =========================
   📡 自动上传定位（关键）
========================= */
function startTracking() {

  if (!navigator.geolocation) {
    setStatus("浏览器不支持定位");
    return;
  }

  navigator.geolocation.watchPosition(async (pos) => {
    try {

      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      await fetch(`${SUPABASE_URL}/rest/v1/user_location`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          Prefer: "return=minimal"
        },
        body: JSON.stringify({ lat, lng })
      });

    } catch (e) {
      console.log("上传失败", e);
    }

  }, (err) => {
    console.log(err);
    setStatus("❌ 无法获取定位权限");
  }, {
    enableHighAccuracy: true,
    maximumAge: 5000,
    timeout: 10000
  });
}

/* =========================
   启动
========================= */
setTimeout(update, 1000);
setInterval(update, 15000);
startTracking();

</script>

</body>
</html>
