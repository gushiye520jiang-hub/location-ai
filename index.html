<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Companion Location System</title>
</head>

<body>
  <h2>🤖 AI伴侣正在关注你...</h2>
  <p id="status">初始化中...</p>

<script>
const SUPABASE_URL = "https://yzhposuiczzthtctafuk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6aHBvc3VpY3p6dGh0Y3RhZnVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MzU3MzMsImV4cCI6MjA5ODAxMTczM30.OWZpBrCxPs-mWCOO0AemjDARelZjI1z6Nv_BsZayzD8";

function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

// 获取历史位置
async function getLatest() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/user_location?select=lat,lng,created_at&order=id.desc&limit=20`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    const data = await res.json();
    return data || [];

  } catch (e) {
    console.log(e);
    return [];
  }
}

// 天气
async function getWeather(lat, lng) {
  try {
    const res = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`
    );

    const data = await res.json();
    return data?.current_weather?.temperature ?? "未知";

  } catch (e) {
    return "未知";
  }
}

// 🧠 主逻辑（AI伴侣核心）
async function update() {
  try {
    setStatus("我在看看你在哪...");

    const list = await getLatest();

    if (!list || list.length === 0) {
      setStatus("我还没有收到你的位置信息...");
      return;
    }

    const latest = list[0];
    const lat = latest.lat;
    const lng = latest.lng;

    setStatus("我在理解你的状态...");

    const temp = await getWeather(lat, lng);

    // 🌍 区域判断
    let area = "你的当前位置";

    if (lat > 35 && lng > 100 && lng < 125) {
      area = "中国东部地区";
    } else if (lat > 20 && lat <= 35 && lng > 105) {
      area = "中国南方地区";
    } else if (lat > 35 && lng < 105) {
      area = "中国西北地区";
    }

    // 🧠 行为分析（记忆核心）
    let sameAreaCount = 0;

    for (let i = 1; i < list.length; i++) {
      const dLat = Math.abs(lat - list[i].lat);
      const dLng = Math.abs(lng - list[i].lng);

      if (dLat < 0.01 && dLng < 0.01) {
        sameAreaCount++;
      }
    }

    // 🌡 情绪判断
    let mood = "";
    let advice = "";

    if (temp >= 30) {
      mood = "有点热";
      advice = "记得多喝水";
    } else if (temp >= 20) {
      mood = "挺舒服";
      advice = "适合出门走走";
    } else if (temp >= 10) {
      mood = "有点凉";
      advice = "记得带外套";
    } else {
      mood = "很冷";
      advice = "注意保暖";
    }

    // ❤️ AI伴侣语言（关键升级）
    let companion = "";

    if (sameAreaCount > 4) {
      companion = "你最近好像一直在这个地方，是在休息吗？";
    } else if (sameAreaCount <= 2) {
      companion = "你今天移动得有点多，是在外面忙吗？";
    } else {
      companion = "我正在慢慢了解你的生活节奏。";
    }

    const finalText =
      `我看了一下，你现在在${area}，天气${mood}，温度大约${temp}°C，${advice}。\n\n${companion}`;

    setStatus(`📍 ${area}\n🌡 ${temp}°C\n🧠 ${finalText}`);

  } catch (e) {
    console.log(e);
    setStatus("我刚刚有点卡住了，可以刷新一下吗？");
  }
}

// 启动
setTimeout(update, 500);
setInterval(update, 15000);

</script>

</body>
</html>
