<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Location System</title>
</head>

<body>
  <h2>📍 AI定位系统运行中...</h2>
  <p id="status">初始化中...</p>

<script>
const SUPABASE_URL = "https://yzhposuiczzthtctafuk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6aHBvc3VpY3p6dGh0Y3RhZnVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MzU3MzMsImV4cCI6MjA5ODAxMTczM30.OWZpBrCxPs-mWCOO0AemjDARelZjI1z6Nv_BsZayzD8";

// 👉 高德 API KEY（你填这里）
const AMAP_KEY = "51cef85f98f92987840a4100de0f3fe0";

function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

// 1️⃣ 获取最新位置
async function getLatest() {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/user_location?select=lat,lng&order=id.desc&limit=1`,
    {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`
      }
    }
  );

  const data = await res.json();
  return data && data[0] ? data[0] : null;
}

// 2️⃣ 🌍 高德逆地理编码（稳定版）
async function getCity(lat, lng) {
  try {
    const url = `https://restapi.amap.com/v3/geocode/regeo?location=${lng},${lat}&key=${AMAP_KEY}`;

    const res = await fetch(url);
    const data = await res.json();

    return (
      data?.regeocode?.addressComponent?.city ||
      data?.regeocode?.addressComponent?.province ||
      data?.regeocode?.addressComponent?.district ||
      "未知城市"
    );
  } catch (e) {
    return "未知城市";
  }
}

// 3️⃣ 天气（继续用免费稳定API）
async function getWeather(lat, lng) {
  try {
    const res = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`
    );

    const data = await res.json();
    return data?.current_weather?.temperature ?? "未知";
  } catch (e) {
    return "未知";
  }
}

// 4️⃣ 主流程
async function update() {
  try {
    setStatus("读取最新位置...");

    const loc = await getLatest();

    if (!loc) {
      setStatus("暂无数据");
      return;
    }

    setStatus("解析城市...");

    let city = "未知城市";
    let temp = "未知";

    try {
      city = await getCity(loc.lat, loc.lng);
    } catch {}

    setStatus("获取天气...");

    try {
      temp = await getWeather(loc.lat, loc.lng);
    } catch {}

    setStatus(`📍 ${city} | 🌡 ${temp}°C`);

  } catch (e) {
    console.log(e);
    setStatus("系统错误");
  }
}

// 5️⃣ 启动
update();
setInterval(update, 15000);

</script>

</body>
</html>
