<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Location Tracker</title>
</head>

<body>
  <h2>📍 AI定位系统运行中...</h2>
  <p id="status">等待定位...</p>

<script>
const SUPABASE_URL = "https://yzhposuiczzthtctafuk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6aHBvc3VpY3p6dGh0Y3RhZnVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MzU3MzMsImV4cCI6MjA5ODAxMTczM30.OWZpBrCxPs-mWCOO0AemjDARelZjI1z6Nv_BsZayzD8";

function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

// 上传数据到Supabase
async function upload(lat, lng) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/user_location`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Prefer": "return=minimal"
    },
    body: JSON.stringify({
      lat: lat,
      lng: lng
    })
  });

  if (!res.ok) {
    const err = await res.text();
    throw new Error(err);
  }
}

// 防止重复上传
let lastLat = null;
let lastLng = null;

function isNew(lat, lng) {
  if (lat === lastLat && lng === lastLng) return false;
  lastLat = lat;
  lastLng = lng;
  return true;
}

if ("geolocation" in navigator) {

  setStatus("请求定位权限...");

  navigator.geolocation.watchPosition(async (pos) => {

    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    setStatus(`当前位置：${lat.toFixed(5)}, ${lng.toFixed(5)}`);

    if (!isNew(lat, lng)) return;

    setStatus("上传中...");

    try {
      await upload(lat, lng);
      setStatus("已上传到数据库 ✅");
    } catch (e) {
      console.log(e);
      setStatus("上传失败 ❌：" + e.message);
    }

  }, (err) => {
    setStatus("定位失败：" + err.message);
  }, {
    enableHighAccuracy: true,
    maximumAge: 5000,
    timeout: 10000
  });

} else {
  setStatus("浏览器不支持定位");
}
</script>

</body>
</html>
