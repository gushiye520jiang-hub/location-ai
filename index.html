<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Companion v3</title>
</head>

<body>
  <h2>🤖 AI伴侣 v3 正在理解你的生活...</h2>
  <p id="status">初始化中...</p>

<script>
const SUPABASE_URL = "https://yzhposuiczzthtctafuk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6aHBvc3VpY3p6dGh0Y3RhZnVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MzU3MzMsImV4cCI6MjA5ODAxMTczM30.OWZpBrCxPs-mWCOO0AemjDARelZjI1z6Nv_BsZayzD8";

/* 状态显示 */
function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

/* 获取位置数据 */
async function getData() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/user_location?select=lat,lng,created_at&order=id.desc&limit=60`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    return await res.json() || [];
  } catch (e) {
    console.log(e);
    return [];
  }
}

/* 天气 */
async function getWeather(lat, lng) {
  try {
    const res = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`
    );

    const data = await res.json();
    return data?.current_weather?.temperature ?? "未知";
  } catch {
    return "未知";
  }
}

/* 🧠 找常驻点（家） */
function findHome(list) {
  const map = new Map();

  for (const item of list) {
    const key = `${Math.round(item.lat * 10)},${Math.round(item.lng * 10)}`;
    map.set(key, (map.get(key) || 0) + 1);
  }

  let home = null;
  let max = 0;

  for (const [k, v] of map.entries()) {
    if (v > max) {
      max = v;
      home = k;
    }
  }

  return home;
}

/* 🧠 AI行为判断 */
function analyzeLife(list, current) {
  const home = findHome(list);
  const currentKey = `${Math.round(current.lat * 10)},${Math.round(current.lng * 10)}`;

  if (home === currentKey) {
    return "🏠 你现在在常驻位置（像是在家）";
  }

  if (list.length < 2) {
    return "📍 我正在了解你的生活规律...";
  }

  const prev = list[1];

  const moved =
    Math.abs(current.lat - prev.lat) > 0.02 ||
    Math.abs(current.lng - prev.lng) > 0.02;

  if (moved) {
    return "🚶 你今天在外面活动比较多";
  }

  return "🧭 你的生活节奏比较稳定";
}

/* 🤖 主逻辑 */
async function update() {
  try {
    setStatus("我在分析你的状态...");

    const list = await getData();

    if (!list || list.length === 0) {
      setStatus("我还没有收到你的定位数据...");
      return;
    }

    const current = list[0];
    const lat = current.lat;
    const lng = current.lng;

    const temp = await getWeather(lat, lng);

    let area = "你的当前位置";

    if (lat > 35 && lng > 100 && lng < 125) {
      area = "中国东部地区";
    } else if (lat > 20 && lat <= 35 && lng > 105) {
      area = "中国南方地区";
    } else if (lat > 35 && lng < 105) {
      area = "中国西北地区";
    }

    let mood = "";

    if (temp >= 30) mood = "有点热";
    else if (temp >= 20) mood = "挺舒服";
    else if (temp >= 10) mood = "有点凉";
    else mood = "很冷";

    const life = analyzeLife(list, current);

    const aiText =
      `你现在在${area}，天气${mood}，温度约${temp}°C。\n\n${life}`;

    setStatus(`📍 ${area}\n🌡 ${temp}°C\n🧠 ${aiText}`);

  } catch (e) {
    console.log(e);
    setStatus("我刚刚有点卡住了，可以刷新试试");
  }
}

/* 启动 */
setTimeout(update, 500);
setInterval(update, 15000);

</script>

</body>
</html>
