<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Memory Location System</title>
</head>

<body>
  <h2>📍 AI记忆系统运行中...</h2>
  <p id="status">初始化中...</p>

<script>
const SUPABASE_URL = "https://yzhposuiczzthtctafuk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6aHBvc3VpY3p6dGh0Y3RhZnVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MzU3MzMsImV4cCI6MjA5ODAxMTczM30.OWZpBrCxPs-mWCOO0AemjDARelZjI1z6Nv_BsZayzD8";

function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

// 获取历史位置（关键：记忆基础）
async function getLatest() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/user_location?select=lat,lng,created_at&order=id.desc&limit=20`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    const data = await res.json();
    return data || [];

  } catch (e) {
    console.log(e);
    return [];
  }
}

// 天气
async function getWeather(lat, lng) {
  try {
    const res = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`
    );

    const data = await res.json();
    return data?.current_weather?.temperature ?? "未知";

  } catch (e) {
    return "未知";
  }
}

// 🧠 AI记忆分析核心
function analyzeMemory(list) {
  if (!list || list.length < 5) {
    return "📍 数据还不够，AI正在学习你的行为...";
  }

  const latest = list[0];

  let sameAreaCount = 0;

  for (let i = 1; i < list.length; i++) {
    const dLat = Math.abs(latest.lat - list[i].lat);
    const dLng = Math.abs(latest.lng - list[i].lng);

    if (dLat < 0.01 && dLng < 0.01) {
      sameAreaCount++;
    }
  }

  if (sameAreaCount > 3) {
    return "📍 AI判断：你最近长期停留在同一个区域";
  } else {
    return "📍 AI判断：你今天有明显的移动轨迹";
  }
}

// 🤖 主逻辑
async function update() {
  try {
    setStatus("读取位置...");

    const list = await getLatest();

    if (!list || list.length === 0) {
      setStatus("暂无数据（请打开手机定位页面）");
      return;
    }

    const latest = list[0];

    const lat = latest.lat;
    const lng = latest.lng;

    setStatus("获取天气...");

    const temp = await getWeather(lat, lng);

    setStatus("AI分析中...");

    // 🌍 区域判断
    let area = "";

    if (lat > 35 && lng > 100 && lng < 125) {
      area = "中国东部地区";
    } else if (lat > 20 && lat <= 35 && lng > 105) {
      area = "中国南方地区";
    } else if (lat > 35 && lng < 105) {
      area = "中国西北地区";
    } else {
      area = "当前位置区域";
    }

    // 🧠 AI天气建议
    let mood = "";
    let advice = "";

    if (temp >= 30) {
      mood = "有点炎热";
      advice = "记得多喝水，避免暴晒";
    } else if (temp >= 20) {
      mood = "比较舒适";
      advice = "适合外出走走";
    } else if (temp >= 10) {
      mood = "有点凉意";
      advice = "建议带外套";
    } else {
      mood = "比较寒冷";
      advice = "注意保暖";
    }

    const aiText =
      `我看了一下你的位置，你现在在${area}，天气${mood}，温度约${temp}°C，${advice}。`;

    // 🧠 记忆输出
    const memoryText = analyzeMemory(list);

    setStatus(
      `📍 ${area}\n🌡 ${temp}°C\n🧠 ${aiText}\n🧭 ${memoryText}`
    );

  } catch (e) {
    console.log(e);
    setStatus("系统错误，请刷新");
  }
}

// 启动
setTimeout(update, 500);
setInterval(update, 15000);

</script>

</body>
</html>
