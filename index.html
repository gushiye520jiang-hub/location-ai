<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Location Companion</title>
</head>

<body>
  <h2>🤖 AI定位伴侣系统</h2>
  <pre id="status">初始化中...</pre>

<script>

/* =========================
   Supabase配置
========================= */
const SUPABASE_URL = "https://yzhposuiczzthtctafuk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6aHBvc3VpY3p6dGh0Y3RhZnVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MzU3MzMsImV4cCI6MjA5ODAxMTczM30.OWZpBrCxPs-mWCOO0AemjDARelZjI1z6Nv_BsZayzD8";

/* =========================
   UI
========================= */
function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

/* =========================
   全局状态
========================= */
let lastLat = null;
let lastLng = null;
let uploadCount = 0;

/* =========================
   Supabase上传
========================= */
async function uploadLocation(lat, lng) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/user_location`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Prefer": "return=representation"
      },
      body: JSON.stringify({
        lat,
        lng,
        created_at: new Date().toISOString()
      })
    });

    const text = await res.text();
    console.log("📡 Supabase response:", text);

    uploadCount++;
    return text;

  } catch (e) {
    console.log("❌ upload error:", e);
  }
}

/* =========================
   防抖：判断是否值得上传
========================= */
function shouldUpload(lat, lng) {
  if (lastLat === null || lastLng === null) return true;

  const diff =
    Math.abs(lat - lastLat) +
    Math.abs(lng - lastLng);

  return diff > 0.0003;
}

/* =========================
   获取历史数据
========================= */
async function getData() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/user_location?select=lat,lng,created_at&order=created_at.desc&limit=60`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    return await res.json() || [];
  } catch (e) {
    console.log(e);
    return [];
  }
}

/* =========================
   天气
========================= */
async function getWeather(lat, lng) {
  try {
    const res = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`
    );

    const data = await res.json();
    return data?.current_weather?.temperature ?? "未知";
  } catch {
    return "未知";
  }
}

/* =========================
   AI：找常驻点
========================= */
function findHome(list) {
  const map = new Map();

  for (const item of list) {
    const key = `${Math.round(item.lat * 10)},${Math.round(item.lng * 10)}`;
    map.set(key, (map.get(key) || 0) + 1);
  }

  let home = null;
  let max = 0;

  for (const [k, v] of map.entries()) {
    if (v > max) {
      max = v;
      home = k;
    }
  }

  return home;
}

/* =========================
   AI行为分析
========================= */
function analyzeLife(list, current) {
  if (!list.length) return "📍 正在学习你的行为模式...";

  const home = findHome(list);
  const currentKey = `${Math.round(current.lat * 10)},${Math.round(current.lng * 10)}`;

  if (home === currentKey) {
    return "🏠 你在常驻地点（类似在家）";
  }

  if (list.length < 5) {
    return "📍 数据还不够，我正在学习你的规律";
  }

  const prev = list[1];

  const moved =
    Math.abs(current.lat - prev.lat) > 0.02 ||
    Math.abs(current.lng - prev.lng) > 0.02;

  if (moved) {
    return "🚶 你最近移动频繁";
  }

  return "🧭 你的生活节奏较稳定";
}

/* =========================
   AI主逻辑
========================= */
async function updateAI(current) {
  const list = await getData();

  const temp = await getWeather(current.lat, current.lng);

  let area = "未知区域";

  if (current.lat > 35 && current.lng > 100 && current.lng < 125) {
    area = "中国东部";
  } else if (current.lat > 20 && current.lat <= 35 && current.lng > 105) {
    area = "中国南方";
  } else if (current.lat > 35 && current.lng < 105) {
    area = "中国西北";
  }

  const life = analyzeLife(list, current);

  setStatus(
`📍 区域：${area}
🌡 温度：${temp}°C

🧠 AI分析：
${life}

📡 上传次数：${uploadCount}`
  );
}

/* =========================
   定位 + 上传核心
========================= */
function startTracking() {

  if (!navigator.geolocation) {
    setStatus("❌ 浏览器不支持定位");
    return;
  }

  setStatus("📡 请求定位权限...");

  navigator.geolocation.watchPosition(async (pos) => {

    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    console.log("📍 GPS:", lat, lng);

    setStatus(`📍 ${lat.toFixed(4)}, ${lng.toFixed(4)}`);

    /* ===== 防重复上传 ===== */
    if (!shouldUpload(lat, lng)) {
      console.log("⏸ 跳过重复上传");
      return;
    }

    lastLat = lat;
    lastLng = lng;

    console.log("⬆️ 上传中...");

    await uploadLocation(lat, lng);

    /* ===== AI更新 ===== */
    await updateAI({ lat, lng });

  }, (err) => {
    console.log(err);
    setStatus("❌ 定位失败：" + err.message);
  }, {
    enableHighAccuracy: true,
    maximumAge: 5000,
    timeout: 10000
  });
}

/* =========================
   启动系统
========================= */
startTracking();

</script>

</body>
</html>
